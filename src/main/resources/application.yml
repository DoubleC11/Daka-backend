server:
  port: 8080

spring:
  application:
    name: daka
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发默认连 127.0.0.1；容器/服务器用环境变量覆盖
    # （DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD）
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:daka}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:daka}
    password: ${DB_PASSWORD:daka@2026}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

daka:
  jwt:
    # 生产部署用环境变量 JWT_SECRET 注入；未设置时用本地开发密钥
    secret: ${JWT_SECRET:daka-life-record-jwt-secret-key-please-change-in-production-2026}
    expire-hours: ${JWT_EXPIRE_HOURS:168}

logging:
  level:
    com.daka: info
